app:
  brand_name: "GTA 6 Clipping Pipeline"
  dry_run: true

sources:
  youtube:
    enabled: true
    weight: 1.0
    queries:
      - "GTA 6 trailer"
      - "GTA 6 gameplay"
      - "GTA 6 leak"
      - "Grand Theft Auto VI secret"
      - "GTA 6 reaction breakdown"
    date_queries:
      - "GTA 6"
      - "GTA VI gameplay"
      - "GTA 6 leak"
    max_results_per_query: 10
    max_duration_seconds: 600
    metadata_fetch_gap_seconds: 0.5
  official_channels:
    weight: 0.20 # Official publishers/platforms down-weighted so creator videos rank higher
    channel_ids:
      - "UC6VcWc1rAoWdBCM0JxrRQ3A" # Rockstar Games
      - "UCqjhXNy3aa-j3vXNf_Hq1jw" # Rockstar Games (alt)
      - "UC-2Y8dQb0S6DtpxNgAKoJKA" # PlayStation
      - "UCjBp_7RuDBUYbd1LegWEJ8g" # Xbox
      - "UCWOA1ZGywLbqmigxE4Qlvvw" # Netflix
      - "UCKy1dAqELo0zrOtPkf0eTMw" # IGN
      - "UCbu2SsF-Or3Rsn3NxBNL00g" # GameSpot
  twitch: # Helix clips for the game category; downloaded by yt-dlp, scored and deduped like YouTube
    enabled: false # true forces Twitch on now; false = follow enable_from
    enable_from: "2026-11-19" # auto-enabled from this date (UTC), the GTA VI launch. null = never
    game_name: "Grand Theft Auto VI" # resolved to a game id through Helix and cached
    game_id: null # set to pin the id and skip the lookup
    weight: 1.10
    limit: 20 # clips per run (Helix returns them by view count, max 100)
    lookback_hours: 48 # only clips created in this window
    languages: ["en"] # [] = any language
    min_views: 0
  kick:
    enabled: false
    # Official API at api.kick.com/public has no clips endpoint.
    # Website clips require scraping around undocumented endpoints.
    # Disabled until an official clips endpoint is released.

discovery:
  min_age_hours: 0.5
  half_life_hours: 36.0
  velocity_power: 1.2
  rolling_pool_size: 100
  score_formula: >
    (percentile_rank ** velocity_power) * (0.5 ** (age_hours / half_life_hours)) * effective_weight

dedupe:
  crop_black_bars: true
  fps: 1
  hamming_threshold: 8 # Max bit difference per frame
  download_coverage_threshold: 0.65 # Fraction of shorter video duration that must match
  consecutive_frames: 3 # Frames sequence window for Hamming comparison

download:
  # Sources are capped at 1080p H.264 (avc1). yt-dlp's default picked AV1 1440p60, which the
  # laptop's ffmpeg decodes far slower than real time, so dedupe (180 s) and scene detection
  # (300 s) timed out. Fallback chain in pipeline/download.py:format_selector; AV1 is never picked.
  max_height: 1080
  reject_codecs: ["av1"] # a finished download in one of these codecs is failed, not processed
  format: null # set a yt-dlp selector here to replace the built-in chain entirely

buffer:
  target_ready_items: 6 # Pull-based cap: process only enough to maintain 6 ready items

cut:
  target_duration: 20.0
  min_duration: 18.0
  max_duration: 22.0
  short_clip_threshold: 30.0
  scene_threshold: 0.3
  audio_weight: 0.75
  scene_weight: 0.25
  intro_outro_penalty_pct: 0.05
  min_scene_change_density: 0.05 # Minimum scene cut density to reject static videos
  # A cut may only END after a completed sentence (pipeline/endings.py). The cut stage
  # transcribes each candidate window (faster-whisper, same model as hooks) plus a tail;
  # a window whose 18-22 s end range has no sentence break is skipped for the next-best
  # window, and an item with none fails at cut with `no_clean_ending`.
  ending:
    punct_gap_s: 0.15 # a word ending in . ? ! followed by this much silence ends a sentence
    pause_gap_s: 0.6 # any word gap this long ends a sentence
    min_after_word_s: 0.07 # the end never sits closer than this to the last word...
    next_word_margin_s: 0.07 # ...or to the next one
    end_after_word_s: 0.35 # in a long gap, keep this much room on both sides of the end
    tail_s: 2.0 # transcribe this far past the window's max end, to see the gap after it
    max_windows: 8 # candidate windows to cut and dedupe-check before giving up
    # whisper's word timestamps are not precise enough for short gaps (0.00 s reported over a
    # real pause; a 0.15 s gap reported where the speaker ran on). After . ? ! the AUDIO decides:
    # the end goes in the middle of the earliest measured pause after the word.
    audio_gap_drop_db: 12.0 # this far under the clip's speech level...
    audio_gap_min_s: 0.2 # ...for at least this long (0.15 s after "level" read as "." or "," by turns: comma-length)
    audio_gap_search_s: 0.4 # ...within this far after whisper's word end
    pause_drop_db: 8.0 # with audio, the >= pause_gap_s case is a measured stretch this far under the speech
    no_speech_gap_s: null # disabled: whisper silently dropping words once made a "nobody speaks" gap over live speech
  # Sentence-aligned windows (pipeline/sentence_windows.py): the source is transcribed once and
  # every clean sentence end gives a candidate window, scored with the audio/scene formula.
  sentence_windows:
    full_transcribe_max_s: 660 # transcribe the whole source up to this long (discovery caps at 600 s)
    region_count: 6 # longer sources: only the top-scoring regions...
    region_margin_s: 10 # ...widened by this much
    start_bonus: 0.05 # soft bonus when the window starts right before a sentence (scores are 0..1)
    start_step_s: 0.5 # start grid inside [end - max_duration, end - min_duration]
    start_lead_s: 0.15 # a sentence-start window begins this long before the sentence's first word
    length_margin_s: 0.1 # windows stop this short of max_duration (an encoded 22.00 s cut came out 22.005 s)
  # One line is added to every failure alert once this share of cut attempts in the last 24 h
  # failed with no_clean_ending (and a cut that fails that way then alerts on its own).
  no_clean_ending_alert:
    rate: 0.40
    min_attempts: 5

# Every faster-whisper transcription (cut stage, hooks, render captions, VO, scripts) uses this
# model and passes this glossary, so GTA names come out right on the burned-in captions.
# Changing the model, the glossary or glossary_as invalidates every cached cut transcript
# (items.transcript_words is keyed on all three) - the next cut/render transcribes again.
transcribe:
  model: "small.en" # chosen by scripts/benchmark_captions.py on the laptop: PLAN.md calls #155-#159
  glossary_as: "hotwords" # hotwords | initial_prompt | both | none. NOT initial_prompt: with small.en it dropped 42 of 79 words on a real clip
  glossary:
    - "GTA 6" # "GTA VI" removed: as a hotword it turned a spoken "GTA 6" into "GTA VI"
    - "Grand Theft Auto"
    - "Rockstar"
    - "Rockstar Games"
    - "Leonida"
    - "Leonida Keys"
    - "Vice City"
    - "Port Gellhorn"
    - "Ambrosia"
    - "Grassrivers"
    - "Mount Kalaga"
    - "Everglades"
    - "Miami"
    - "Lucia"
    - "Jason"
    - "Cal"
    - "Boobie"
    - "Dre'Quan"
    - "Raul"
    - "Brian"
    - "Trevor"
    - "Michael"
    - "Franklin"
    - "wanted level"
  # faster-whisper always runs with vad_filter=True; these are its vad_parameters (the values it used
  # before they were configurable). Part of the cache key: changing one re-transcribes.
  vad:
    threshold: 0.5
    min_silence_duration_ms: 500
    speech_pad_ms: 400
    min_speech_duration_ms: 0
  # After whisper, every word is checked against Silero's speech probability (per 32 ms) of the same
  # audio: under music whisper places words where nobody speaks (Trailer 2: "I'm" 9.5 s early).
  # Part of the cache key. PLAN.md calls #180-#183.
  speech_check:
    enabled: true
    word_min_prob: 0.35 # a word is dropped when no 32 ms frame in its span (+/- word_pad_s) reaches this
    word_pad_s: 0.1
    region_threshold: 0.5 # speech regions: probability >= this, held while >= threshold - 0.15...
    region_onset_prob: 0.15 # ...started back where the ramp-up began (Silero lags a real onset by ~0.3 s)...
    region_min_silence_s: 0.3 # ...split by at least this much non-speech...
    region_pad_s: 0.1 # ...padded by this much each side
    clamp_tolerance_s: 0.15 # a word starting this much before the speech region it runs into starts at the region

gemini:
  model: "gemini-2.5-flash"
  # 2.5-flash "thinking" tokens count against maxOutputTokens: at the old 1024 cap they
  # used ~920 and truncated the JSON (finishReason MAX_TOKENS). Thinking off, roomier cap.
  thinking_budget: 0 # set to null to omit thinkingConfig (models that cannot disable thinking)
  max_output_tokens: 2048
  requests_per_minute: 5 # free tier: calls are spaced 60/5 = 12 s apart
  rate_limit_retries: 2 # per call: on HTTP 429, wait the server's retryDelay, then retry
  max_rate_limit_wait_s: 120 # a longer retryDelay = daily quota gone: fail fast, never sleep hours
  max_attempts: 3 # hook generation attempts per item before the hooks stage fails
  # Segment-check FAILs (keyword overlap with the cut's transcript, then a Gemini PASS/FAIL that may
  # only use the cut's transcript + frames) before the item goes to needs_review: 2 = the first hook
  # plus one regeneration. needs_review items are not rendered; Telegram shows them for a decision.
  grounding_fail_limit: 2
  fallback_hook: "IS THIS REALLY GTA 6?" # no longer rendered silently (kept for old configs)
  # Outages (HTTP 5xx, timeouts, connection errors) are retried after these waits and never use up one
  # of the max_attempts above. Still failing -> the item stays in its stage for the next cycle
  # (items.transient_errors counts the cycles); never failed or rejected for an outage. 429s keep
  # their own retryDelay handling above. Truncated/unparseable answers still count as attempts.
  # PLAN.md calls #177-#179.
  transient_backoff_s: [10, 30, 90] # 3 retries after the first try: wait 10 s, 30 s, 90 s (the 12 s pacing still applies)
  transient_alert_after_cycles: 6 # one failure alert (Telegram) when an item has waited this many cycles in a row

# Free checks every hook AND voiceover line gets against the CUT SEGMENT's transcript before the
# Gemini PASS/FAIL (pipeline/hooks.py). A FAIL is regenerated once with the reason, then the item
# goes to needs_review. Lists are lower-case; a word matches with simple stemming (plural, -ed, -ing).
# PLAN.md calls #173-#176.
hook_check:
  # Overlap: the line's content words (what is left after stopwords, generic_topic_words and
  # claim_words) must share at least this many with the segment transcript. The Tridzo hook
  # "LEAKED ..." passed on ONE shared word ("VERSION"); that is now generic and the bar is 2.
  min_shared_content_words: 2
  single_word_lines_ok: true # a line with only ONE content word passes if the segment says it ("WHO IS LUCIA?"); false = 2 always
  generic_topic_words: [gta, vi, "6", six, game, rockstar, version, trailer, new, video,
                        gta6, gtavi, grand, theft, auto, games, gameplay, clip, footage]
  # Claim words in the hook or the voiceover pass only for an OFFICIAL item whose segment transcript
  # itself makes that claim (same word or stem). An UNVERIFIED item never gets one, even if the
  # segment says it: its hook stays a question.
  claim_words: [leak, leaked, confirmed, official, real, revealed, insider, exclusive, proof]
  stopwords: [a, an, the, and, or, but, if, so, of, to, in, on, at, by, for, from, with, without, into,
              onto, out, up, down, off, over, is, "isn't", are, "aren't", was, "wasn't", were, be, been,
              being, am, do, does, did, "don't", "doesn't", "didn't", can, "can't", could, should, would,
              will, "won't", might, must, has, have, had, it, "it's", its, this, that, these, those, there,
              here, i, you, your, we, our, they, their, he, his, she, her, me, my, us, them, what, why, how,
              who, where, when, which, "i'm", "you're", "he's", "she's", "we're", "they're", "that's",
              "what's", "there's", "here's", "let's", "who's", "i'll", "you'll", "we'll", "they'll", "i've",
              "you've", "we've", "they've", gonna, wanna, really, actually, just, even, ever, yet, now,
              still, already, finally, only, also, too, very, much, more, most, big, biggest, huge, massive,
              crazy, craziest, insane, wild, best, worst, good, bad, true, fake, rumor, rumors, secret,
              secrets, hidden, detail, details, thing, things, moment, moments, look, looks, see, seen,
              watch, wait, nobody, everyone, anyone, noticed, missed, know, knew, change, changes, changed,
              back, coming, come, happen, happened, happening, going, get, got, make, made, one, all]

render:
  width: 1080
  height: 1920
  fps: 30
  audio_sample_rate: 48000
  audio_channels: 2
  audio_bitrate: "192k"
  fonts_dir: "assets/fonts"
  font_path: "assets/fonts/Montserrat-Black.ttf"
  font_name: "Montserrat Black" # static Black (900) face; nameID 1 of Montserrat-Black.ttf
  # (the whisper model moved to transcribe.model below)
  target_lufs: -14.0
  voiceover_target_duration_s: 4.5
  # Variant B freeze-frame format: first frame held for VO duration + pad, then the cut plays at full level.
  freeze_pad_s: 0.3
  end_fade_s: 0.25 # audio fade-out at the very end of A and B
  av_duration_tolerance_s: 0.1 # verification fails if |audio - video| stream duration exceeds this
  # Instagram-safe text area (pixels on the 1080x1920 canvas).
  safe_area:
    x_min: 90
    x_max: 990
    y_min: 250
    y_max: 1440
  # libass sizes the font so (winAscent + winDescent) = Fontsize; for Montserrat that gives
  # cap height = 0.448 x Fontsize. 138 -> ~62 px caps, 150 -> ~67 px caps (measured).
  caption:
    font_size: 138
    outline: 7
    shadow: 3
    max_words: 3
    max_gap_s: 0.6
    center_y: 1300
    color: "&H00FFFFFF" # white
    highlight_color: "&H0000FFFF" # yellow (ASS is &HAABBGGRR)
    # Captions under music (PLAN.md calls #180-#183). Measured with Silero on the cut itself
    # (transcribe.speech_check region settings), at render time:
    min_speech_ratio: 0.25 # speech share of the cut below this -> NO word captions (hook only; VO captions in B stay), logged
    max_outside_speech_s: 1.0 # a caption line with any word further than this from a speech region is dropped
  hook:
    font_size: 150
    min_font_size: 96 # only used if a hook cannot fit 2 lines inside the safe width
    outline: 8
    shadow: 3
    max_lines: 2
    # Band moved up (was 280-560) so the 2 hook lines clear the zoom-to-fill video top
    # edge at y=534; only used when the style layer does not re-place the band itself.
    band_top_y: 260
    band_bottom_y: 500
    # 1.75 x cap height -> ~118 px pitch, ~29 px between the two lines' outlines
    # (1.45 left only ~9 px, so the outlines nearly touched).
    line_spacing: 1.75
    # Floor on the gap: outline/shadow are absolute px, so on a hook that had to shrink
    # a cap-height multiple alone collapses to ~3 px between the outlines.
    min_line_gap_px: 18
    color: "&H0000FFFF" # yellow

# ======================================================================================
# Style layer: edit effects as independently toggleable flags, grouped into presets.
# The pipeline renders `style.preset` (P0). P1-P3 are opt-in until a preset is picked.
#   F1 zoom_fill | C1 keyword_color | C2 keyword_emoji | C3 progress_bar | C4 credit_tag
#   M1 caption_pop | M2 hook_pop | M3 punch_ins | M4 slow_push
#   A1 sfx | A2 music_bed | A3 dead_air | A4 loop_end
# ======================================================================================
style:
  preset: "P0" # pipeline default; do not change without a decision
  presets:
    P0: # Control: the CP2 renders plus zoom-to-fill framing
      base: null
      enable: ["zoom_fill"]
    P1: # Clean
      base: "P0"
      enable:
        - "keyword_color"
        - "keyword_emoji"
        - "progress_bar"
        - "credit_tag"
        - "caption_pop"
        - "dead_air"
        - "loop_end"
    P2: # Punchy
      base: "P1"
      enable: ["hook_pop", "punch_ins", "sfx"]
    P3: # Full hype
      base: "P2"
      enable: ["slow_push", "music_bed"]

  # F1 -- zoom-to-fill framing -------------------------------------------------------
  zoom_fill:
    fill_scale: 1.40 # foreground band 608 px -> 852 px tall, sides centre-cropped
    supersample: 1.5 # working canvas 1620x1278, so the fill never upscales the source
    crossfade_s: 0.25 # cross-scale when a segment changes framing mode
    motion_threshold: 0.018 # mean frame difference; below this a segment stays full-width fit
    motion_step_s: 0.2 # frame-difference sampling step
    min_segment_s: 1.2 # scene cuts closer than this do not start a new segment
    edge_clearance_px: 40 # text must clear every video edge by this much

  # M1 -- caption pop-in --------------------------------------------------------------
  caption_pop:
    from_scale: 80
    peak_scale: 115
    peak_ms: 60
    settle_ms: 160

  # M2 -- hook pop + shake ------------------------------------------------------------
  hook_pop:
    from_scale: 55
    scale_ms: 250
    shake_deg: 1.5
    shake_ms: 400
    shake_steps: 4

  # M3 -- punch-ins -------------------------------------------------------------------
  punch_ins:
    zoom: 1.12
    ease_in_s: 0.12
    hold_s: 0.8 # inside the 0.6-1.0 s window
    ease_out_s: 0.12
    min_gap_s: 3.0
    max_count: 4
    first_at_least_s: 1.5

  # M4 -- slow push-in across static segments and the B freeze -----------------------
  slow_push:
    zoom_to: 1.06

  # C1 -- keyword colour --------------------------------------------------------------
  keyword_color:
    color: "&H0000FF00" # green (ASS is &HAABBGGRR); yellow stays the spoken word
    min_keywords: 3
    max_keywords: 6
    extra_terms: ["JASON", "LUCIA", "LEONIDA", "VICE", "AMBROSIA", "TRAILER", "LEAK", "MAP", "HEIST"]

  # C2 -- keyword emojis (Twemoji PNGs; libass cannot draw colour emoji) -------------
  keyword_emoji:
    assets_dir: "assets/emoji"
    size_px: 110
    min_gap_s: 4.0 # at most one emoji per 4 s
    hold_s: 1.6
    rise_px: 24
    rise_ms: 120
    gap_above_caption_px: 28
    map:
      CAR: "1f697"
      CARS: "1f697"
      BIKE: "1f3cd"
      MONEY: "1f4b0"
      CASH: "1f4b0"
      POLICE: "1f693"
      CHASE: "1f6a8"
      MAP: "1f5fa"
      CITY: "1f3d9"
      BEACH: "1f3d6"
      LEAK: "1f440" # eyes: in GTA context a leak is leaked info, not a water droplet
      LEAKED: "1f440"
      TRAILER: "1f3ac"
      GAMEPLAY: "1f3ae"
      INSANE: "1f92f"
      CRAZY: "1f92f"
      FIRE: "1f525"
      REAL: "1f440"

  # C3 -- progress bar ----------------------------------------------------------------
  progress_bar:
    height_px: 10
    color: "&H0000FFFF" # yellow

  # C4 -- credit tag ------------------------------------------------------------------
  credit_tag:
    text: "via {channel}"
    font_size: 71 # -> ~32 px caps measured
    color: "&H00FFFFFF" # white
    alpha: "&H33&" # ~80% opacity
    outline: 3
    shadow: 2
    inset_x_px: 0 # from safe_area.x_min
    inset_y_px: 16 # above the video band bottom
    gap_from_caption_px: 24 # minimum clearance from the caption ink

  # A1 -- SFX --------------------------------------------------------------------------
  sfx:
    dir: "assets/sfx"
    boom_file: "boom.wav"
    whoosh_file: "whoosh.wav"
    headroom_db: 6.0 # every SFX peak sits at least this far under the speech peak
    boom_at_s: 0.0 # the hook's first frame
    whoosh_lead_s: 0.06 # whoosh starts just before the punch-in
    # Density (enforced only in audio_mix.plan_sfx_cues, on the final output timeline):
    # the hook boom first, then a whoosh only on a punch-in that is min_gap_s clear of
    # every other cue (start to start); other punch-ins zoom silently.
    min_gap_s: 5.0
    max_per_clip: 2

  # A2 -- music bed (no sidechaincompress; volume automation from word timestamps) ----
  music_bed:
    file: "assets/music/bed.mp3" # CC0; downloaded by scripts/fetch_assets.py
    level_db: -24.0
    duck_db: -8.0 # a further 8 dB down during speech
    duck_ramp_s: 0.08
    speech_merge_gap_s: 0.3

  # A3 -- dead-air removal -------------------------------------------------------------
  dead_air:
    min_silence_s: 0.4
    loudness_threshold_lufs: -45.0
    motion_threshold: 0.012 # must ALSO be visually still before a stretch is cut
    keep_pad_s: 0.12
    min_output_s: 15.0 # hard floor: never cut below this
    loudness_lag_s: 0.2 # ebur128 momentary covers the 400 ms ENDING at t; re-centre it

  # A4 -- loop-friendly ending ---------------------------------------------------------
  loop_end:
    search_step_s: 0.2
    pause_bonus_bits: 6 # a speech pause is worth 6 bits of dHash distance
    audio_fade_s: 0.15 # no video fade; audio fade capped at 0.15 s

approval:
  mode: "telegram" # 'telegram' or 'auto' ('auto' skips Telegram and applies the gate below)
  # Telegram approval for the first N days counted from the FIRST LIVE POST, then auto (the
  # quality gate below), with one Telegram notice at the switch. null = approve by hand forever.
  switch_to_auto_after_days: 7
  auto_quality_gate:
    require_both_renders: true
    require_ffprobe_pass: true
    require_grounded_hook: true
    max_duration_seconds: 22.0 # applies to Variant A (the cut-length render)
    # Variant B is a freeze-frame plus the cut, so it is longer by design (PLAN.md section 7).
    # It is checked against this much headroom over A instead of max_duration_seconds.
    max_b_extra_seconds: 8.0

posting:
  profile: "local" # 'local' or 'server'
  profiles:
    local:
      timezone: "Asia/Kolkata"
      slots: ["13:00", "18:00"]
    server:
      timezone: "America/New_York"
      slots: ["18:00", "21:00"]
  min_gap_hours: 3.0 # between any two posts (scheduled slots and real live times)
  # A queued post that has not started within this long after its slot (laptop asleep, Meta
  # paused) is NOT sent late: the scheduler moves it to the next free slot, one per slot.
  missed_slot_grace_minutes: 90
  max_slot_search_days: 60
  meta_min_gap_seconds: 3.0 # minimum gap between any two Meta requests, shared across processes
  daily_post_target: 2
  platforms:
    instagram: true
    facebook: true
  # Creator-credit caption per source ({hook_text}, {author_name}, {channel}, {hashtags}).
  # Reddit was dropped as a source, so it has no template; unknown sources use youtube's.
  hashtags: "#gta6 #grandtheftauto #gta #gaming #rockstargames"
  caption_templates:
    youtube: "{hook_text}\n\nCredit: {author_name}\n.\n{hashtags}"
    twitch: "{hook_text}\n\nClipped from {author_name} on Twitch\ntwitch.tv/{channel}\n.\n{hashtags} #twitchclips"
  # Meta Graph API (CP3)
  graph_base: "https://graph.facebook.com"
  rupload_base: "https://rupload.facebook.com"
  api_version: "v25.0"
  # 'plan_only' (default): a dry run sends NO write request; the whole state machine runs and every
  # request that would go out is logged and written to media/dry_run/. 'up_to_publish': the real
  # container is created and the real bytes are uploaded, only the publish call is skipped - that
  # touches the live account, so it is opt-in.
  dry_run_mode: "plan_only"
  max_retries: 3 # per-request retries on 5xx / network errors
  retry_backoff_s: 2.0 # exponential: 2s, 4s, 8s ...
  retry_backoff_cap_s: 30.0
  max_post_attempts: 3 # a posts row is given up on after this many attempts
  rate_limit_pause_hours: 3.0 # a 429 or block pauses every Meta call for this long
  container_poll_seconds: 10.0
  container_poll_max_minutes: 5.0
  recent_media_limit: 25 # recent media checked when resolving a crash in 'publishing'

telegram:
  enabled: true
  api_base: "https://api.telegram.org"
  poll_timeout_s: 30
  edit_throttle_gap_s: 2.5

autopilot:
  alert_every_hours: 12
  # A/B variant: 50/50 random for week_one_days from the first live post, then epsilon-greedy over
  # ab_learning - the leading variant gets 1 - floor, the other keeps the floor.
  week_one_days: 7
  bandit_min_exploration_floor: 0.20
  bandit_min_samples_per_variant: 3 # until both variants have this many measured posts: 50/50

# Metric snapshots for every live post (pipeline/analytics.py). Graph API insight names change
# often: they are listed here, not in code. If Graph refuses one, it is skipped and alerted once.
# The Facebook names below were checked against Meta's Video Insights reference on 2026-11-10
# (PLAN.md call 172); the Instagram names are still unchecked - see PLAN.md call 103.
# Permissions (SETUP.md 2c): Instagram needs instagram_manage_insights; Facebook needs a Page token
# with read_insights AND pages_manage_engagement. scripts/cp3_dry_run.py fails without them.
analytics:
  snapshot_hours: [24, 72]
  max_snapshot_late_hours: 12 # a snapshot later than this is skipped (insights are cumulative)
  score_weights: {views: 1.0, likes: 0.0, comments: 0.0, shares: 0.0} # raw score ranked per platform
  instagram: # GET /{ig-media-id}/insights?metric=...   (instagram_manage_insights)
    endpoint: "{remote_id}/insights"
    metrics: ["views", "likes", "comments", "shares", "saved", "reach", "total_interactions"]
    map:
      views: ["views", "plays"] # first name present in the answer wins
      likes: "likes"
      comments: "comments"
      shares: "shares"
  facebook: # GET /{video-id}/video_insights?metric=...   (read_insights + pages_manage_engagement)
    endpoint: "{remote_id}/video_insights"
    metrics:
      - "fb_reels_total_plays"
      - "blue_reels_play_count"
      - "post_impressions_unique"
      - "post_video_likes_by_reaction_type"
      - "post_video_social_actions"
    map:
      views: ["fb_reels_total_plays", "blue_reels_play_count"]
      likes: "post_video_likes_by_reaction_type" # a {reaction: count} breakdown, summed
      comments: "post_video_social_actions.COMMENT" # one key of a breakdown
      shares: "post_video_social_actions.SHARE"

# Disk retention (pipeline/cleanup.py). Nothing a pending / publishing post still needs is ever
# deleted, and only files inside media/ are touched.
retention:
  purge_downloads_immediately: true # the source download goes once the item is rendered
  purge_renders_after_days: 7 # renders, cut, voiceover and subtitles, counted from the live post
  purge_rejected_failed_after_days: 3 # all media of a rejected / failed item

orchestrator:
  loop_interval_seconds: 60
  heartbeat_interval_seconds: 30
  heartbeat_stale_seconds: 120
